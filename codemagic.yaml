# Note that this configuration is not an exact match to UI settings. Review and adjust as necessary.

variables:
  - &localproperties
    name: Set up local.properties
    script: |
      cat >> "$CM_BUILD_DIR/app/android/local.properties" <<EOF
      storePassword=$CM_KEYSTORE_PASSWORD
      keyPassword=$CM_KEY_PASSWORD
      keyAlias=$CM_KEY_ALIAS
      storeFile=$CM_KEYSTORE_PATH
      flutter.sdk=$HOME/programs/flutter
      EOF
  - &getpackages
    script: cd app && flutter packages pub get
  - &ghrelease
    name: Publish to GitHub
    script: |
      #!/usr/bin/env zsh
      gh release create "${CM_BRANCH}-${CM_COMMIT}" \
        --title "sudonym ${CM_BRANCH}-${CM_COMMIT}" \
       app/build/app/outputs/bundle/release/app-release.aab \
       app/build/app/outputs/flutter-apk/app-release.apk

workflows:
  default-workflow: &default-workflow
    name: Default Workflow
    instance_type: linux
    max_build_duration: 60
    integrations:
      app_store_connect: SUDONYM LTD
    environment:
      groups:
        - google_credentials
        - github_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.sudonym.wallet
      android_signing:
        - patrick
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.sudonym.wallet"
        XCODE_WORKSPACE: "app/ios/Runner.xcworkspace" # <-- Put the name of your Xcode workspace here
        XCODE_SCHEME: "CodemagicSample" # <-- Put the name of your Xcode scheme here
        APP_ID: 6443904661
    artifacts:
      - app/build/**/outputs/ipa/**/*.ipa
      - app/build/**/outputs/apk/**/*.apk
      - app/build/**/outputs/bundle/**/*.aab
      - app/build/**/outputs/**/mapping.txt
      - app/*.snap
      - app/build/windows/**/*.msix
      - app/flutter_drive.log
      - app/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - patrick@sudonym.app
      slack:
        channel: "#general"
        notify_on_build_start: true
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        in_app_update_priority: 0
        submit_as_draft: true
      app_store_connect:
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY

        submit_to_app_store: true
    when:
      changeset:
        includes:
          - "app/"
          - "models/"
