# Automatically generated on 2022-09-26 UTC from https://codemagic.io/app/621e5974bc3d3d5bbbc82181/settings
# Note that this configuration is not an exact match to UI settings. Review and adjust as necessary.

workflows:
  default-workflow:
    name: Default Workflow
    max_build_duration: 60
    environment:
      android_signing:
        - patrick
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: test
          include: true
          source: true
        - pattern: staging
          include: true
          source: true
        - pattern: production
          include: true
          source: true
      tag_patterns:
        - pattern: '*'
          include: true
    scripts:
      - name: Set up key.properties
        script: |
          cat >> "$CM_BUILD_DIR/project_directory/android/key.properties" <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF    
      - |
        # set up local properties
        echo "flutter.sdk=$HOME/programs/flutter" > "$FCI_BUILD_DIR/app/android/local.properties"
      - cd app && flutter packages pub get
      - cd app && flutter build appbundle --debug
    artifacts:
      - app/build/**/outputs/apk/**/*.apk
      - app/build/**/outputs/bundle/**/*.aab
      - app/build/**/outputs/**/mapping.txt
      - app/*.snap
      - app/build/windows/**/*.msix
      - app/flutter_drive.log
    publishing:
      email:
        recipients:
          - patrick@sudonym.app
      slack:
        channel: '#general'
        notify_on_build_start: true
      google_play:
        credentials: Encrypted()
        track: beta
        in_app_update_priority: 0
    when:
        changeset:
          includes:
            - 'app/'
            - 'models/'