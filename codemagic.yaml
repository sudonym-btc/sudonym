  production-android-workflow:
    <<: *default-workflow
    name: "Production Android Workflow"
    instance_type: linux
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: production
          include: true
          source: true
      tag_patterns:
        - pattern: "*"
          include: true
    scripts:
      - *localproperties
      - *getpackages
      - name: "build"
        script: |
          BUILD_NUMBER=$(($(google-play get-latest-build-number --package-name 'com.sudonym.sudonym') + 1))
          cd app
          flutter build appbundle --build-number=$BUILD_NUMBER -t lib/main-prod.dart --release
          flutter build apk --build-number=$BUILD_NUMBER -t lib/main-prod.dart --release
      - *ghrelease
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        in_app_update_priority: 0
        submit_as_draft: true
  production-apple-workflow:
    <<: *default-workflow
    name: "Production iOS Workflow"
    instance_type: mac_mini_m1
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: production
          include: true
          source: true
      tag_patterns:
        - pattern: "*"
          include: true
    scripts:
      - *getpackages
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: build
        script: |
          BUILD_NUMBER=$(($(app-store-connect get-latest-testflight-build-number "$APP_ID") + 1)) 
          cd app && flutter build ipa -t lib/main-prod.dart --release --export-options-plist=/Users/builder/export_options.plist --build-number=$BUILD_NUMBER
    publishing:
      app_store_connect:
        # Use referenced App Store Connect API key to authenticate binary upload
        auth: integration

        # Configuration related to TestFlight (optional)

        # Optional boolean, defaults to false. Whether or not to submit the uploaded
        # build to TestFlight beta review. Required for distributing to beta groups.
        # Note: This action is performed during post-processing.
        submit_to_testflight: true

        # Specify the names of beta tester groups that will get access to the build
        # once it has passed beta review.
        beta_groups:
          - beta

        # Configuration related to App Store (optional)

        # Optional boolean, defaults to false. Whether or not to submit the uploaded
        # build to App Store review. Note: This action is performed during post-processing.
        submit_to_app_store: false
