workflows:
  default-workflow:
    name: Default Workflow
    max_build_duration: 60
    environment:
      vars:
        FCI_KEYSTORE_PATH: /tmp/keystore.keystore
        FCI_KEYSTORE: Encrypted()
        FCI_KEYSTORE_PASSWORD: Encrypted(Z0FBQUFBQmpNY3d0YlAzRjNnUnVEakpWN01FYUVKQjVZQTFMNlhZcjRzaTk1UERiZmh1X3pqeUdXZlVtNWhQZHV1U21KRU1qZVNNMHhCaWpMTzRYZlJxdHVZa0JUemhQOXc9PQ==)
        FCI_KEY_PASSWORD: Encrypted(Z0FBQUFBQmpNY3d0Y1BBYUpGZEhBVHRQbFpzYWRHTGt0S2tObElWSzNLRnVVYUJuNURGR0lXQk9GQ1RCV3lBeHR5aUlOSVhIVl9ucWhzRWxVTzhEVUM1bDFCMXBFX1dNU2c9PQ==)
        FCI_KEY_ALIAS: Encrypted(Z0FBQUFBQmpNY3d0U2RrcjYzN00wQWQxTkVqMUQ2d1FiVDVDTFJYZnU1ZHh0bzVJTlJjMVphTlVvd3F5VE13X3htc05Yei1Uc1EzaXJIZjU5N2g5azRpWkdDbm5lanRGN3c9PQ==)
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: test
          include: true
          source: true
        - pattern: staging
          include: true
          source: true
        - pattern: production
          include: true
          source: true
      tag_patterns:
        - pattern: '*'
          include: true
    scripts:
      - |
        # set up key.properties
        echo $FCI_KEYSTORE | base64 --decode > $FCI_KEYSTORE_PATH
        cat >> "$FCI_BUILD_DIR/app/android/key.properties" <<EOF
        storePassword=$FCI_KEYSTORE_PASSWORD
        keyPassword=$FCI_KEY_PASSWORD
        keyAlias=$FCI_KEY_ALIAS
        storeFile=/tmp/keystore.keystore
        EOF
      - |
        # set up local properties
        echo "flutter.sdk=$HOME/programs/flutter" > "$FCI_BUILD_DIR/app/android/local.properties"
      - cd app && flutter packages pub get
      - cd app && flutter build appbundle --debug
    artifacts:
      - app/build/**/outputs/apk/**/*.apk
      - app/build/**/outputs/bundle/**/*.aab
      - app/build/**/outputs/**/mapping.txt
      - app/*.snap
      - app/build/windows/**/*.msix
      - app/flutter_drive.log
    publishing:
      email:
        recipients:
          - patrick@sudonym.app
      slack:
        channel: '#general'
        notify_on_build_start: true
      google_play:
        credentials: Encrypted()
        track: beta
        in_app_update_priority: 0
    when:
        changeset:
          includes:
            - 'app/'