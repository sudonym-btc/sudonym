apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: dns-issuer
spec:
  acme:
    solvers:
    - dns01:
        cloudDNS:
          # The ID of the GCP project
          project: sudonym-lightning-test
          # This is the secret used to access the service account
          serviceAccountSecretRef:
            name: clouddns-dns01-solver-svc-acct
            key: key.json

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dns-tls
spec:
  secretName: self-signed-tls
  dnsNames:
  - "*.test.sudonym.app"
  - "*.staging.sudonym.app"
  issuerRef:
    name: dns-issuer