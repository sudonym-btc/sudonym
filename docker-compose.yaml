version: "3.3"
networks:
  lnnet:

services:
  bitcoind:
    container_name: bitcoind
    build:
        context: ops/docker/bitcoind
    image: lnbook/bitcoind:latest
    networks:
      - lnnet
    expose:
      - "18443"
      - "12005"
      - "12006"
    restart: always
  
  lightning:
    container_name: lightning
    build:
      context: ops/docker/c-lightning
    image: lnbook/c-lightning:latest
    networks:
      - lnnet
    expose:
      - "9735"
    volumes:
      - lightning-rpc-volume:/rpc
    restart: always
    depends_on:
      - bitcoind

  lightning2:
    container_name: lightning2
    build:
      context: ops/docker/c-lightning
    image: lnbook/c-lightning2:latest
    networks:
      - lnnet
    ports:
      - "9736:9735"
    volumes:
      - lightning2-rpc-volume:/rpc
    restart: always
    depends_on:
      - bitcoind

  lightning-rest:
    container_name: lightning-rest
    build:
      context: ops/docker/c-lightning-rest
      dockerfile: arm64v8.Dockerfile
    image: lnbook/c-lightning-rest:latest
    networks:
      - lnnet
    ports:
      - "3001:3001"
    expose:
      - "3001"
    restart: always
    environment:
      - LNRPCPATH=/rpc/lightningd
    depends_on:
      - lightning
    volumes:
      - lightning-rpc-volume:/rpc
      - lightning-rest-certs:/usr/src/app/certs

  rtl:
    container_name: rtl
    build:
        context: ops/docker/ridethelightning
        dockerfile: dockerfiles/Dockerfile
    image: lnbook/rtl:latest
    volumes:
      - lightning-rest-certs:/usr/src/app/certs
    networks:
      - lnnet
    ports:
      - 3000:3000


  Thunderhub:
    image: apotdevin/thunderhub:v0.13.6
    volumes:
      - ./ops/docker/thunderhub/config:/config
    environment:
      - ACCOUNT_CONFIG_PATH=/config/accounts.yaml
    networks:
      - lnnet
    ports:
      - 3000:3000

volumes:
  lightning-rpc-volume: 
  lightning-rest-certs: 
  lightning2-rpc-volume: 