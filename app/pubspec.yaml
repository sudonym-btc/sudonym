name: sudonym
description: Sudonym bitcoin wallet.

publish_to: "none"

version: 0.0.1+9

environment:
  sdk: ">=2.18.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:  
    sdk: flutter
  intl: ^0.17.0  
  equatable: ^2.0.3
  flutter_bloc: ^8.0.1
  dartz: ^0.10.1
  stream_transform: ^2.0.0
  injectable: ^1.5.3
  get_it: ^7.2.0
  dio: ^4.0.4
  native_flutter_proxy: ^0.1.15
  sudonym.models:
    path: ../models/dart
  firebase_auth: ^3.4.1
  firebase_core: ^1.19.1
  firebase_messaging: ^11.4.4
  google_sign_in: ^5.2.4
  flutter_facebook_auth: ^4.3.4+2
  http: ^0.13.4
  timeago: ^3.2.2
  font_awesome_flutter: ^10.1.0
  carousel_slider: ^4.0.0
  smooth_page_indicator: ^1.0.0+2
  sliding_up_panel: ^2.0.0+1 
  qr_flutter: ^4.0.0
  mobile_scanner: ^2.0.0
  extended_masked_text: ^2.3.1
  clipboard: ^0.1.3
  # share_plus: ^3.1.0 
  number_display: ^3.0.0
  web_socket_channel: ^2.2.0
  dart_lnurl: ^0.1.0
  bech32: any
  money_formatter: ^0.0.3
  auto_animated: ^3.1.0
  app_links: ^3.2.0
  flutter_local_notifications: ^9.6.1
  firebase_app_installations: ^0.1.1+1
  sentry_flutter: ^6.6.3
  flutter_form_builder: ^7.3.1
  reactive_forms: ^14.1.0
  loggy: ^2.0.1+1
  logger: ^1.1.0
  flutter_loggy_dio: ^2.0.0+3
  nfc_manager: ^3.1.1
  package_info_plus: ^1.4.3+1
  flutter_ringtone_player: ^3.2.0

dev_dependencies:
  test: ^1.21.1
  flutter_test:
    sdk: flutter
  firebase_auth_mocks: ^0.8.4
  google_sign_in_mocks: ^0.2.1
  widgetbook: ^2.3.0
  icons_launcher: ^2.0.5
  injectable_generator:
  # add build runner if not already added
  build_runner:
  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^2.0.1

flutter:
  generate: true
  uses-material-design: true

  # fonts:
  #   - family: Satoshi
  #     fonts:
  #       - asset: assets/fonts/Satoshi-Black.ttf
  #       - asset: assets/fonts/Satoshi-BlackItalic.ttf
  #         style: italic
  #       - asset: assets/fonts/Satoshi-Bold.ttf
  #         weight: 700
  assets:
    - assets/mastercardLogo.png
    - assets/visaLogo.png

icons_launcher:
  image_path: 'assets/logo.png'
  platforms:
    android:
      enable: true
    ios:
      enable: true